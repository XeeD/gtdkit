[package]
name = "gtdkit"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/XeeD/gtdkit"
description = "GTD workflow utilities, starting with email inbox-processing sessions."

[dependencies]
anstream = "0.6"
anstyle = "1"
camino = { version = "1.1", features = ["serde1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
clap_mangen = "0.2"
comfy-table = "7.1"
fs4 = { version = "0.13", features = ["tokio"] }
jiff = { version = "0.2", features = ["serde"] }
miette = { version = "7.6", features = ["fancy"] }
schemars = { version = "0.8", features = ["chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.45", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
insta = { version = "1", features = ["json"] }
predicates = "3"
pretty_assertions = "1"
proptest = "1"
rstest = "0.25"

[profile.dev.package]
insta.opt-level = 3
